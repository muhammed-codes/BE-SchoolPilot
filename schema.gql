  maxPeriodsPerDay: Int!
  maxPeriodsPerWeek: Int!
  teacherId: String!
}

input UpdateTimetableEntryInput {
  allowOverride: Boolean! = false
  dayOfWeek: Int
  id: String!
  isDoublePeriod: Boolean
  periodId: String
  roomId: String
  subjectId: String
  teacherId: String
}

input UpdateUserInput {
  email: String
  firstName: String
  lastName: String
  namePrefix: NamePrefix
  phone: String
  role: UserRole
}

"""The `Upload` scalar type represents a file upload."""
scalar Upload

type UploadResult {
  expiresAt: Float
  pdfPrivateUrl: String
  publicId: String!
  url: String!
}

type User {
  assignedClassId: String
  avatarUrl: String
  createdAt: DateTime!
  email: String
  expoPushToken: String
  firstName: String!
  fullName: String!
  id: ID!
  isActive: Boolean!
  isClassTeacher: Boolean
  isEmailVerified: Boolean!
  lastName: String!
  maxPeriodsPerDay: Int
  maxPeriodsPerWeek: Int
  namePrefix: NamePrefix
  phone: String
  role: UserRole!
  schoolId: String
  staffId: String
  updatedAt: DateTime!
}

enum UserRole {
  CLASS_TEACHER
  HEAD_TEACHER
  PARENT
  PRINCIPAL
  SCHOOL_ADMIN
  SUBJECT_TEACHER
  SUPER_ADMIN
  VICE_PRINCIPAL
}