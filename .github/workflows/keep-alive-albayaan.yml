name: Supabase Keep-Alive (Albayaan)

on:
  schedule:
    - cron: '0 17 * * 1,4' # Runs at 17:00 UTC (6 PM WAT) every Monday and Thursday
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Supabase client
        run: npm install @supabase/supabase-js

      - name: Ping Supabase to prevent auto-pause (Albayaan)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL_ALBAYAAN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_ALBAYAAN }}
        run: |
          node -e "
            const { createClient } = require('@supabase/supabase-js');
            const supabase = createClient(process.env.SUPABASE_URL, process.env.SUPABASE_SERVICE_ROLE_KEY);

            supabase
              .from('keep-alive')
              .select('name')
              .limit(1)
              .then(({ data, error }) => {
                if (error) {
                  console.error('Ping failed:', error.message);
                  process.exit(1);
                }
                console.log('Supabase (albayaan) is alive. Result:', JSON.stringify(data));
              });
          "
